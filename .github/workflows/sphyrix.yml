name: sphyrix
on:
  push:
    branches: [sphyrix]
  pull_request:
    branches: [sphyrix]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: env var annotations
        run: make check-env-var-annotations
      - name: build
        run: go build -mod=vendor ./...
      - name: storage-users tests
        run: go test -mod=vendor ./services/storage-users/...
